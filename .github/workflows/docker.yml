name: Publish Agent Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'configs/Dockerfile.*'
      - '.github/workflows/docker.yml'
      - 'scripts/build-images.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'configs/Dockerfile.*'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: alpine
            dockerfile: configs/Dockerfile.alpine-agent
            is_default: true
          - flavor: ubuntu
            dockerfile: configs/Dockerfile.ubuntu-agent
            is_default: false
          - flavor: browser
            dockerfile: configs/Dockerfile.browser-agent
            is_default: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Repository Name
        id: prep
        run: |
          # GHCR requires repository names to be strictly lowercase
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${REGISTRY}/${REPO_LOWER}/vessel-agent" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image_name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.flavor }},enable=true
            type=raw,value=latest,enable=${{ matrix.is_default && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
            type=semver,pattern={{version}}-${{ matrix.flavor }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.flavor }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./configs
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
